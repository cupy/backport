name: "Pre-review Tests"

on: [push, pull_request]

jobs:
  pretest:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: install dependencies
      run: |
        pip install pygithub

    - name: run help
      run: |
        ./backport.py --help

    - name: install dev dependencies
      run: |
        pip install mypy

    - name: mypy
      run: |
        mypy .
